[package]
name = "andrui-terminal"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Browser-based Android workstation: ADB, automation, screen mirroring"

# Built by scripts/build-deb.sh, which builds the frontend, helper APK and release binary first.
# Relative asset paths resolve from this crate's directory.
[package.metadata.deb]
maintainer = "AndruiTerminal maintainers <tayefi.ilia@protonmail.com>"
copyright = "2024-2026, The AndruiTerminal Authors"
section = "devel"
priority = "optional"
depends = "$auto, adb, tesseract-ocr, android-sdk-platform-tools-common"
extended-description = """\
Local single-user Android workstation served on http://127.0.0.1:19801. \
Uses the system adb and Tesseract. Start it per user with: \
systemctl --user enable --now andrui-terminal"""
assets = [
    ["target/release/andrui-terminal", "usr/bin/", "755"],
    ["../../web/dist/index.html", "usr/share/andrui-terminal/web/", "644"],
    ["../../web/dist/*.txt", "usr/share/andrui-terminal/web/", "644"],
    ["../../web/dist/favicon.ico", "usr/share/andrui-terminal/web/", "644"],
    ["../../web/dist/logos/*", "usr/share/andrui-terminal/web/logos/", "644"],
    ["../../web/dist/assets/*", "usr/share/andrui-terminal/web/assets/", "644"],
    ["../andrui-media/assets/scrcpy-server-v3.3.1", "usr/share/andrui-terminal/", "644"],
    ["../../helper-apk/build/andrui-helper.apk", "usr/share/andrui-terminal/", "644"],
    ["../../packaging/andrui-terminal.service", "usr/lib/systemd/user/", "644"],
    ["../andrui-media/LICENSE", "usr/share/doc/andrui-terminal/scrcpy-LICENSE", "644"],
    ["../andrui-media/NOTICE", "usr/share/doc/andrui-terminal/scrcpy-NOTICE", "644"],
    # Generated by scripts/third-party-licenses.py (run from build-deb.sh)
    ["target/release/THIRD-PARTY-LICENSES", "usr/share/doc/andrui-terminal/", "644"],
]

[[bin]]
name = "andrui-terminal"
path = "src/main.rs"

[dependencies]
andrui-core = { path = "../andrui-core" }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
# MCP subcommand: stdio client of the running server
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1.0"
base64 = "0.22"
