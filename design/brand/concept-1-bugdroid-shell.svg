<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bugdroid Shell Gradient -->
    <linearGradient id="droidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Terminal Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d141f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad1)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Subtle Internal Grid Gridlines -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1.5">
    <line x1="80" y1="170" x2="432" y2="170" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="342" x2="432" y2="342" />
    <line x1="170" y1="80" x2="170" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="342" y1="80" x2="342" y2="432" />
  </g>

  <!-- Antennae -->
  <g stroke="url(#droidGrad)" stroke-width="16" stroke-linecap="round">
    <line x1="192" y1="168" x2="152" y2="104" />
    <line x1="320" y1="168" x2="360" y2="104" />
  </g>
  <!-- Antenna Node Tips -->
  <circle cx="152" cy="104" r="5" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="360" cy="104" r="5" fill="#38bdf8" filter="url(#cyanGlow)" />

  <!-- Bugdroid Head Dome -->
  <path d="M 124 256 A 132 132 0 0 1 388 256 Z" fill="url(#droidGrad)" />

  <!-- Optic Sensor Eyes -->
  <circle cx="196" cy="208" r="14" fill="#0f172a" />
  <circle cx="196" cy="208" r="6" fill="#38bdf8" filter="url(#cyanGlow)" />

  <circle cx="316" cy="208" r="14" fill="#0f172a" />
  <circle cx="316" cy="208" r="6" fill="#38bdf8" filter="url(#cyanGlow)" />

  <!-- Terminal Display Visor / Console Unit -->
  <rect x="124" y="272" width="264" height="124" rx="20" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="3" />
  <!-- Screen Rim Highlight -->
  <rect x="126" y="274" width="260" height="120" rx="18" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />

  <!-- Terminal Status Header Dots -->
  <circle cx="150" cy="294" r="4" fill="#f87171" opacity="0.8" />
  <circle cx="164" cy="294" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="178" cy="294" r="4" fill="#34d399" opacity="0.8" />
  <line x1="196" y1="294" x2="370" y2="294" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />

  <!-- Terminal Prompt (> _) -->
  <g filter="url(#emeraldGlow)">
    <!-- Chevron '>' -->
    <path d="M 166 332 L 194 350 L 166 368" fill="none" stroke="#3ddc84" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Blinking Block Cursor '_' -->
    <rect x="214" y="358" width="28" height="9" rx="3" fill="#38bdf8" />
  </g>

  <!-- PTY Output Stream Indicators (subtle tech bars) -->
  <rect x="254" y="345" width="46" height="4" rx="2" fill="#3ddc84" opacity="0.4" />
  <rect x="308" y="345" width="24" height="4" rx="2" fill="#38bdf8" opacity="0.3" />
  <rect x="254" y="357" width="78" height="4" rx="2" fill="#94a3b8" opacity="0.25" />
</svg>